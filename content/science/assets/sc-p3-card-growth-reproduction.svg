<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 596 226" width="596" height="226" role="img">
<title>Which things grow and reproduce.</title>
<rect x="0" y="0" width="596" height="226" fill="#ffffff"/>
<text x="298.0" y="26.0" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#1f2933">Growing and reproducing</text>
