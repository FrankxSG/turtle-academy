<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 610 192" width="610" height="192" role="img">
<title>Features of amphibians and reptiles.</title>
<rect x="0" y="0" width="610" height="192" fill="#ffffff"/>
<text x="305.0" y="26.0" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#1f2933">Amphibians and reptiles</text>
<rect x="10" y="44" width="590" height="34" fill="#e4f2ee"/>
<line x1="10.0" y1="44.0" x2="600.0" y2="44.0" stroke="#1f2933" stroke-width="1.2" stroke-linecap="round"/>
<line x1="10.0" y1="78.0" x2="600.0" y2="78.0" stroke="#1f2933" stroke-width="1.2" stroke-linecap="round"/>
<line x1="10.0" y1="112.0" x2="600.0" y2="112.0" stroke="#1f2933" stroke-width="1.2" stroke-linecap="round"/>
<line x1="10.0" y1="146.0" x2="600.0" y2="146.0" stroke="#1f2933" stroke-width="1.2" stroke-linecap="round"/>
<line x1="10.0" y1="180.0" x2="600.0" y2="180.0" stroke="#1f2933" stroke-width="1.2" stroke-linecap="round"/>
<line x1="10.0" y1="44.0" x2="10.0" y2="180.0" stroke="#1f2933" stroke-width="1.2" stroke-linecap="round"/>
<text x="65.0" y="66.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1f2933">Feature</text>
<text x="65.0" y="100.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#1f2933">skin</text>
<text x="65.0" y="134.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#1f2933">eggs</text>
<text x="65.0" y="168.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#1f2933">examples</text>
<line x1="120.0" y1="44.0" x2="120.0" y2="180.0" stroke="#1f2933" stroke-width="1.2" stroke-linecap="round"/>
<text x="217.5" y="66.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1f2933">Amphibians</text>
<text x="217.5" y="100.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#1f2933">moist and smooth</text>
<text x="217.5" y="134.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#1f2933">soft, laid in water</text>
<text x="217.5" y="168.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#1f2933">frog, toad</text>
<line x1="315.0" y1="44.0" x2="315.0" y2="180.0" stroke="#1f2933" stroke-width="1.2" stroke-linecap="round"/>
<text x="457.5" y="66.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1f2933">Reptiles</text>
<text x="457.5" y="100.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#1f2933">dry and scaly</text>
<text x="457.5" y="134.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#1f2933">leathery shells, laid on land</text>
<text x="457.5" y="168.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#1f2933">lizard, turtle</text>
<line x1="600.0" y1="44.0" x2="600.0" y2="180.0" stroke="#1f2933" stroke-width="1.2" stroke-linecap="round"/>
</svg>
