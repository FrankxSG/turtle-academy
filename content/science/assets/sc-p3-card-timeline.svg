<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 158" width="580" height="158" role="img">
<title>A record of when each stage appeared for two plants.</title>
<rect x="0" y="0" width="580" height="158" fill="#ffffff"/>
<text x="290.0" y="26.0" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#1f2933">Life-cycle record</text>
<rect x="10" y="44" width="560" height="34" fill="#e4f2ee"/>
<line x1="10.0" y1="44.0" x2="570.0" y2="44.0" stroke="#1f2933" stroke-width="1.2" stroke-linecap="round"/>
<line x1="10.0" y1="78.0" x2="570.0" y2="78.0" stroke="#1f2933" stroke-width="1.2" stroke-linecap="round"/>
<line x1="10.0" y1="112.0" x2="570.0" y2="112.0" stroke="#1f2933" stroke-width="1.2" stroke-linecap="round"/>
<line x1="10.0" y1="146.0" x2="570.0" y2="146.0" stroke="#1f2933" stroke-width="1.2" stroke-linecap="round"/>
<line x1="10.0" y1="44.0" x2="10.0" y2="146.0" stroke="#1f2933" stroke-width="1.2" stroke-linecap="round"/>
<text x="65.0" y="66.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1f2933">Plant</text>
<text x="65.0" y="100.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#1f2933">A</text>
<text x="65.0" y="134.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#1f2933">B</text>
<line x1="120.0" y1="44.0" x2="120.0" y2="146.0" stroke="#1f2933" stroke-width="1.2" stroke-linecap="round"/>
<text x="217.5" y="66.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1f2933">Young plant appears</text>
<text x="217.5" y="100.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#1f2933">Week 1</text>
<text x="217.5" y="134.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#1f2933">Week 2</text>
<line x1="315.0" y1="44.0" x2="315.0" y2="146.0" stroke="#1f2933" stroke-width="1.2" stroke-linecap="round"/>
<text x="381.0" y="66.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1f2933">First flower</text>
<text x="381.0" y="100.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#1f2933">Week 6</text>
<text x="381.0" y="134.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#1f2933">Week 10</text>
<line x1="447.0" y1="44.0" x2="447.0" y2="146.0" stroke="#1f2933" stroke-width="1.2" stroke-linecap="round"/>
<text x="508.5" y="66.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1f2933">First fruit</text>
<text x="508.5" y="100.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#1f2933">Week 8</text>
<text x="508.5" y="134.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#1f2933">Week 13</text>
<line x1="570.0" y1="44.0" x2="570.0" y2="146.0" stroke="#1f2933" stroke-width="1.2" stroke-linecap="round"/>
</svg>
