<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 688 192" width="688" height="192" role="img">
<title>How three living things get food.</title>
<rect x="0" y="0" width="688" height="192" fill="#ffffff"/>
<text x="344.0" y="26.0" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#1f2933">Plants and fungi</text>
<rect x="10" y="44" width="668" height="34" fill="#e4f2ee"/>
<line x1="10.0" y1="44.0" x2="678.0" y2="44.0" stroke="#1f2933" stroke-width="1.2" stroke-linecap="round"/>
<line x1="10.0" y1="78.0" x2="678.0" y2="78.0" stroke="#1f2933" stroke-width="1.2" stroke-linecap="round"/>
<line x1="10.0" y1="112.0" x2="678.0" y2="112.0" stroke="#1f2933" stroke-width="1.2" stroke-linecap="round"/>
<line x1="10.0" y1="146.0" x2="678.0" y2="146.0" stroke="#1f2933" stroke-width="1.2" stroke-linecap="round"/>
<line x1="10.0" y1="180.0" x2="678.0" y2="180.0" stroke="#1f2933" stroke-width="1.2" stroke-linecap="round"/>
<line x1="10.0" y1="44.0" x2="10.0" y2="180.0" stroke="#1f2933" stroke-width="1.2" stroke-linecap="round"/>
<text x="76.0" y="66.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1f2933">Living thing</text>
<text x="76.0" y="100.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#1f2933">fern</text>
<text x="76.0" y="134.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#1f2933">mushroom</text>
<text x="76.0" y="168.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#1f2933">bread mould</text>
<line x1="142.0" y1="44.0" x2="142.0" y2="180.0" stroke="#1f2933" stroke-width="1.2" stroke-linecap="round"/>
<text x="197.0" y="66.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1f2933">Green</text>
<text x="197.0" y="100.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#1f2933">Yes</text>
<text x="197.0" y="134.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#1f2933">No</text>
<text x="197.0" y="168.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#1f2933">No</text>
<line x1="252.0" y1="44.0" x2="252.0" y2="180.0" stroke="#1f2933" stroke-width="1.2" stroke-linecap="round"/>
<text x="345.0" y="66.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1f2933">Makes its own food</text>
<text x="345.0" y="100.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#1f2933">Yes</text>
<text x="345.0" y="134.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#1f2933">No</text>
<text x="345.0" y="168.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#1f2933">No</text>
<line x1="438.0" y1="44.0" x2="438.0" y2="180.0" stroke="#1f2933" stroke-width="1.2" stroke-linecap="round"/>
<text x="558.0" y="66.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1f2933">Gets food from</text>
<text x="558.0" y="100.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#1f2933">sunlight (makes its own)</text>
<text x="558.0" y="134.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#1f2933">rotting wood</text>
<text x="558.0" y="168.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#1f2933">bread</text>
<line x1="678.0" y1="44.0" x2="678.0" y2="180.0" stroke="#1f2933" stroke-width="1.2" stroke-linecap="round"/>
</svg>
