<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 587 158" width="587" height="158" role="img">
<title>How two kinds of magnets behave.</title>
<rect x="0" y="0" width="587" height="158" fill="#ffffff"/>
<text x="293.5" y="26.0" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#1f2933">Temporary or permanent?</text>
<rect x="10" y="44" width="567" height="34" fill="#e4f2ee"/>
<line x1="10.0" y1="44.0" x2="577.0" y2="44.0" stroke="#1f2933" stroke-width="1.2" stroke-linecap="round"/>
<line x1="10.0" y1="78.0" x2="577.0" y2="78.0" stroke="#1f2933" stroke-width="1.2" stroke-linecap="round"/>
<line x1="10.0" y1="112.0" x2="577.0" y2="112.0" stroke="#1f2933" stroke-width="1.2" stroke-linecap="round"/>
<line x1="10.0" y1="146.0" x2="577.0" y2="146.0" stroke="#1f2933" stroke-width="1.2" stroke-linecap="round"/>
<line x1="10.0" y1="44.0" x2="10.0" y2="146.0" stroke="#1f2933" stroke-width="1.2" stroke-linecap="round"/>
<text x="80.5" y="66.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1f2933">Magnet</text>
<text x="80.5" y="100.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#1f2933">electromagnet</text>
<text x="80.5" y="134.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#1f2933">fridge magnet</text>
<line x1="151.0" y1="44.0" x2="151.0" y2="146.0" stroke="#1f2933" stroke-width="1.2" stroke-linecap="round"/>
<text x="235.0" y="66.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1f2933">When switched on</text>
<text x="235.0" y="100.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#1f2933">attracts steel</text>
<text x="235.0" y="134.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#1f2933">attracts steel</text>
<line x1="319.0" y1="44.0" x2="319.0" y2="146.0" stroke="#1f2933" stroke-width="1.2" stroke-linecap="round"/>
<text x="448.0" y="66.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1f2933">When switched off</text>
<text x="448.0" y="100.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#1f2933">lets go of the steel</text>
<text x="448.0" y="134.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#1f2933">still attracts (no switch)</text>
<line x1="577.0" y1="44.0" x2="577.0" y2="146.0" stroke="#1f2933" stroke-width="1.2" stroke-linecap="round"/>
</svg>
