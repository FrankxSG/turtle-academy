<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 262 158" width="262" height="158" role="img">
<title>A record of when the first flower and first fruit appeared.</title>
<rect x="0" y="0" width="262" height="158" fill="#ffffff"/>
<text x="131.0" y="26.0" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#1f2933">Plant record</text>
<rect x="10" y="44" width="242" height="34" fill="#e4f2ee"/>
<line x1="10.0" y1="44.0" x2="252.0" y2="44.0" stroke="#1f2933" stroke-width="1.2" stroke-linecap="round"/>
<line x1="10.0" y1="78.0" x2="252.0" y2="78.0" stroke="#1f2933" stroke-width="1.2" stroke-linecap="round"/>
<line x1="10.0" y1="112.0" x2="252.0" y2="112.0" stroke="#1f2933" stroke-width="1.2" stroke-linecap="round"/>
<line x1="10.0" y1="146.0" x2="252.0" y2="146.0" stroke="#1f2933" stroke-width="1.2" stroke-linecap="round"/>
<line x1="10.0" y1="44.0" x2="10.0" y2="146.0" stroke="#1f2933" stroke-width="1.2" stroke-linecap="round"/>
<text x="76.0" y="66.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1f2933">Stage</text>
<text x="76.0" y="100.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#1f2933">First flower</text>
<text x="76.0" y="134.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#1f2933">First fruit</text>
