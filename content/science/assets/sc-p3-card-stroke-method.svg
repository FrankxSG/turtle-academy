<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 175" width="380" height="175" role="img">
<title>A magnet stroking a steel bar, with arrows showing the strokes.</title>
<rect x="0" y="0" width="380" height="175" fill="#ffffff"/>
<rect x="60" y="120" width="260" height="16" fill="#b9c2cc" stroke="#1f2933" stroke-width="1.5"/>
<text x="190.0" y="158.0" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1f2933">steel bar</text>
<rect x="70" y="54" width="35.0" height="22" fill="#3a7bd5" stroke="#1f2933" stroke-width="1.5"/>
<rect x="105.0" y="54" width="35.0" height="22" fill="#d9534f" stroke="#1f2933" stroke-width="1.5"/>
<text x="87.5" y="70.0" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#ffffff">S</text>
<text x="122.5" y="70.0" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#ffffff">N</text>
<line x1="90.0" y1="100.0" x2="300.0" y2="100.0" stroke="#7b8794" stroke-width="1.6" stroke-linecap="round"/>
<line x1="300.0" y1="100.0" x2="291.2" y2="104.8" stroke="#7b8794" stroke-width="1.6" stroke-linecap="round"/>
<line x1="300.0" y1="100.0" x2="291.2" y2="95.2" stroke="#7b8794" stroke-width="1.6" stroke-linecap="round"/>
<line x1="90.0" y1="92.0" x2="300.0" y2="92.0" stroke="#7b8794" stroke-width="1.6" stroke-linecap="round"/>
<line x1="300.0" y1="92.0" x2="291.2" y2="96.8" stroke="#7b8794" stroke-width="1.6" stroke-linecap="round"/>
<line x1="300.0" y1="92.0" x2="291.2" y2="87.2" stroke="#7b8794" stroke-width="1.6" stroke-linecap="round"/>
<line x1="90.0" y1="84.0" x2="300.0" y2="84.0" stroke="#7b8794" stroke-width="1.6" stroke-linecap="round"/>
<line x1="300.0" y1="84.0" x2="291.2" y2="88.8" stroke="#7b8794" stroke-width="1.6" stroke-linecap="round"/>
<line x1="300.0" y1="84.0" x2="291.2" y2="79.2" stroke="#7b8794" stroke-width="1.6" stroke-linecap="round"/>
<text x="190.0" y="26.0" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#7b8794">same pole, same direction, many times;</text>
<text x="190.0" y="42.0" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#7b8794">lift the magnet away after each stroke</text>
</svg>
