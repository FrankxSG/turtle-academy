<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 200" width="380" height="200" role="img">
<title>A magnet under a wooden table top and a paper clip on top.</title>
<rect x="0" y="0" width="380" height="200" fill="#ffffff"/>
