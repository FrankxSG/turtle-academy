<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 150" width="470" height="150" role="img">
<title>A strip resting on two supports with weights hung from its middle, and a results list.</title>
<rect x="0" y="0" width="470" height="150" fill="#ffffff"/>
<rect x="20" y="40" width="40" height="70" fill="#d8b384" stroke="#1f2933" stroke-width="1.2"/>
<rect x="200" y="40" width="40" height="70" fill="#d8b384" stroke="#1f2933" stroke-width="1.2"/>
<rect x="40" y="32" width="180" height="8" fill="#9fd3c7" stroke="#1f2933" stroke-width="1.2"/>
<line x1="130.0" y1="40.0" x2="130.0" y2="70.0" stroke="#1f2933" stroke-width="1.2" stroke-linecap="round"/>
<rect x="118" y="70" width="24" height="18" fill="#b9c2cc" stroke="#1f2933" stroke-width="1.2"/>
<text x="130.0" y="130.0" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#7b8794">weights added until the strip breaks</text>
<text x="360.0" y="30.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1f2933">Strips of the same size</text>
<text x="280.0" y="54.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#1f2933">P: broke at 3 weights</text>
<text x="280.0" y="76.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#1f2933">Q: broke at 8 weights</text>
<text x="280.0" y="98.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#1f2933">R: broke at 5 weights</text>
</svg>
