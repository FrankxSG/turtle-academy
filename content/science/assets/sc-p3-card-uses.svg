<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 527 226" width="527" height="226" role="img">
<title>Uses of magnets and the property used.</title>
<rect x="0" y="0" width="527" height="226" fill="#ffffff"/>
<text x="263.5" y="26.0" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#1f2933">Uses of magnets</text>
<rect x="10" y="44" width="507" height="34" fill="#e4f2ee"/>
<line x1="10.0" y1="44.0" x2="517.0" y2="44.0" stroke="#1f2933" stroke-width="1.2" stroke-linecap="round"/>
<line x1="10.0" y1="78.0" x2="517.0" y2="78.0" stroke="#1f2933" stroke-width="1.2" stroke-linecap="round"/>
<line x1="10.0" y1="112.0" x2="517.0" y2="112.0" stroke="#1f2933" stroke-width="1.2" stroke-linecap="round"/>
<line x1="10.0" y1="146.0" x2="517.0" y2="146.0" stroke="#1f2933" stroke-width="1.2" stroke-linecap="round"/>
<line x1="10.0" y1="180.0" x2="517.0" y2="180.0" stroke="#1f2933" stroke-width="1.2" stroke-linecap="round"/>
<line x1="10.0" y1="214.0" x2="517.0" y2="214.0" stroke="#1f2933" stroke-width="1.2" stroke-linecap="round"/>
<line x1="10.0" y1="44.0" x2="10.0" y2="214.0" stroke="#1f2933" stroke-width="1.2" stroke-linecap="round"/>
<text x="107.5" y="66.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1f2933">Use</text>
<text x="107.5" y="100.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#1f2933">fridge door seal</text>
<text x="107.5" y="134.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#1f2933">compass</text>
<text x="107.5" y="168.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#1f2933">sorting steel cans</text>
<text x="107.5" y="202.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#1f2933">toy train couplings</text>
<line x1="205.0" y1="44.0" x2="205.0" y2="214.0" stroke="#1f2933" stroke-width="1.2" stroke-linecap="round"/>
<text x="361.0" y="66.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1f2933">Property of magnets used</text>
<text x="361.0" y="100.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#1f2933">attracts the steel body</text>
<text x="361.0" y="134.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#1f2933">points north-south</text>
<text x="361.0" y="168.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#1f2933">attracts steel, not aluminium</text>
<text x="361.0" y="202.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#1f2933">like poles repel, unlike attract</text>
<line x1="517.0" y1="44.0" x2="517.0" y2="214.0" stroke="#1f2933" stroke-width="1.2" stroke-linecap="round"/>
</svg>
