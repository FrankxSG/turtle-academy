<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 578 192" width="578" height="192" role="img">
<title>How living things respond to changes.</title>
<rect x="0" y="0" width="578" height="192" fill="#ffffff"/>
<text x="289.0" y="26.0" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#1f2933">Responding to changes</text>
<rect x="10" y="44" width="558" height="34" fill="#e4f2ee"/>
<line x1="10.0" y1="44.0" x2="568.0" y2="44.0" stroke="#1f2933" stroke-width="1.2" stroke-linecap="round"/>
<line x1="10.0" y1="78.0" x2="568.0" y2="78.0" stroke="#1f2933" stroke-width="1.2" stroke-linecap="round"/>
<line x1="10.0" y1="112.0" x2="568.0" y2="112.0" stroke="#1f2933" stroke-width="1.2" stroke-linecap="round"/>
<line x1="10.0" y1="146.0" x2="568.0" y2="146.0" stroke="#1f2933" stroke-width="1.2" stroke-linecap="round"/>
<line x1="10.0" y1="180.0" x2="568.0" y2="180.0" stroke="#1f2933" stroke-width="1.2" stroke-linecap="round"/>
<line x1="10.0" y1="44.0" x2="10.0" y2="180.0" stroke="#1f2933" stroke-width="1.2" stroke-linecap="round"/>
<text x="107.5" y="66.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1f2933">Change around it</text>
<text x="107.5" y="100.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#1f2933">a loud noise</text>
<text x="107.5" y="134.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#1f2933">being touched</text>
<text x="107.5" y="168.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#1f2933">light from a window</text>
<line x1="205.0" y1="44.0" x2="205.0" y2="180.0" stroke="#1f2933" stroke-width="1.2" stroke-linecap="round"/>
<text x="271.0" y="66.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1f2933">Living thing</text>
<text x="271.0" y="100.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#1f2933">cat</text>
<text x="271.0" y="134.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#1f2933">mimosa plant</text>
<text x="271.0" y="168.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#1f2933">potted plant</text>
<line x1="337.0" y1="44.0" x2="337.0" y2="180.0" stroke="#1f2933" stroke-width="1.2" stroke-linecap="round"/>
<text x="452.5" y="66.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1f2933">What it does</text>
<text x="452.5" y="100.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#1f2933">runs away</text>
<text x="452.5" y="134.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#1f2933">leaves fold up</text>
<text x="452.5" y="168.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#1f2933">bends towards the light</text>
<line x1="568.0" y1="44.0" x2="568.0" y2="180.0" stroke="#1f2933" stroke-width="1.2" stroke-linecap="round"/>
</svg>
