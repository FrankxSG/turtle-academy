<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 192" width="448" height="192" role="img">
<title>A comparison of three plants.</title>
<rect x="0" y="0" width="448" height="192" fill="#ffffff"/>
<text x="224.0" y="26.0" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#1f2933">Comparing plants</text>
<rect x="10" y="44" width="428" height="34" fill="#e4f2ee"/>
<line x1="10.0" y1="44.0" x2="438.0" y2="44.0" stroke="#1f2933" stroke-width="1.2" stroke-linecap="round"/>
<line x1="10.0" y1="78.0" x2="438.0" y2="78.0" stroke="#1f2933" stroke-width="1.2" stroke-linecap="round"/>
<line x1="10.0" y1="112.0" x2="438.0" y2="112.0" stroke="#1f2933" stroke-width="1.2" stroke-linecap="round"/>
<line x1="10.0" y1="146.0" x2="438.0" y2="146.0" stroke="#1f2933" stroke-width="1.2" stroke-linecap="round"/>
<line x1="10.0" y1="180.0" x2="438.0" y2="180.0" stroke="#1f2933" stroke-width="1.2" stroke-linecap="round"/>
<line x1="10.0" y1="44.0" x2="10.0" y2="180.0" stroke="#1f2933" stroke-width="1.2" stroke-linecap="round"/>
<text x="65.0" y="66.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1f2933">Plant</text>
<text x="65.0" y="100.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#1f2933">balsam</text>
<text x="65.0" y="134.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#1f2933">mango</text>
<text x="65.0" y="168.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#1f2933">fern</text>
<line x1="120.0" y1="44.0" x2="120.0" y2="180.0" stroke="#1f2933" stroke-width="1.2" stroke-linecap="round"/>
<text x="177.0" y="66.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1f2933">Grows from</text>
<text x="177.0" y="100.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#1f2933">seed</text>
<text x="177.0" y="134.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#1f2933">seed</text>
<text x="177.0" y="168.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#1f2933">spores</text>
<line x1="234.0" y1="44.0" x2="234.0" y2="180.0" stroke="#1f2933" stroke-width="1.2" stroke-linecap="round"/>
<text x="336.0" y="66.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1f2933">Time to first fruits</text>
<text x="336.0" y="100.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#1f2933">a few months</text>
<text x="336.0" y="134.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#1f2933">a few years</text>
<text x="336.0" y="168.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#1f2933">no fruits</text>
