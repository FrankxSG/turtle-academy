<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 270" width="460" height="270" role="img">
<title>BLUE RECYCLING BIN — WHAT GOES IN?</title>
<rect x="0" y="0" width="460" height="270" fill="#ffffff"/>
<rect x="8" y="8" width="444" height="254" rx="14" fill="#ffffff" stroke="#1f2933" stroke-width="3"/>
<rect x="8" y="8" width="444" height="52" rx="14" fill="#bfe3c0"/>
<rect x="8" y="40" width="444" height="20" fill="#bfe3c0"/>
<text x="230.0" y="42.0" font-family="Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" font-weight="bold" fill="#1f2933">BLUE RECYCLING BIN — WHAT GOES IN?</text>
<text x="230.0" y="92.0" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="normal" fill="#1f2933">YES: paper, cardboard, plastic bottles,</text>
<text x="230.0" y="122.0" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="normal" fill="#1f2933">metal cans, glass bottles</text>
<text x="230.0" y="152.0" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="normal" fill="#1f2933">NO: food waste, tissue paper, styrofoam,</text>
<text x="230.0" y="182.0" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="normal" fill="#1f2933">greasy pizza boxes</text>
<text x="230.0" y="212.0" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="bold" fill="#1f2933">Tip: Rinse bottles and cans before recycling!</text>
<text x="230.0" y="242.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#7b8794">Collection: every Tuesday morning</text>
</svg>
