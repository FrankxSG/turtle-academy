name: Database contract
on:
  pull_request:
    paths:
      - 'supabase/**'
      - 'src/auth/**'
      - 'src/snapshot/**'
      - '.github/workflows/db-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: db-contract-${{ github.ref }}
  cancel-in-progress: true
jobs:
  db-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      # Synthetic-only: a throwaway local PostgreSQL cluster, no services, secrets or network.
      - run: python3 supabase/tests/test_database.py
      - run: node --experimental-strip-types --test supabase/tests/client/client.test.mjs
