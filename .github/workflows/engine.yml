name: Learning engine
on:
  pull_request:
    paths:
      - 'src/engine/**'
      - 'src/catalogue/**'
      - 'src/mistakes/**'
      - 'src/snapshot/**'
      - 'tests/engine/**'
      - 'src/sync/**'
      # Engine tests also import the presentation registry and development fixtures.
      - 'src/ui/content.ts'
      - 'src/ui/development.ts'
      - '.github/workflows/engine.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: engine-${{ github.ref }}
  cancel-in-progress: true
jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      # Synthetic fixtures only; Node's built-in test runner, no dependency install, services or secrets.
      - run: node --experimental-strip-types --test tests/engine/*.test.ts
